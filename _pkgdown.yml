title: "Uso del paquete renoe"

template:
  bootstrap: 5
  params:
    highlight: textmate

home:
  title: "renoe"
  description: "Herramientas para descargar, procesar y analizar los microdatos de la ENOE"

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fa-github
      aria-label: "Repositorio de renoe en GitHub"
      href: https://github.com/aniuxa/renoe

reference:
  - title: "Descarga y documentación"
    contents:
      - descarga_enoe
      - fusion_enoe
      - carga_enoe
      - info_trimestre
      - descargar_cuestionarios

  - title: "Procesamiento de microdatos"
    contents:
      - procesar_variables_enoe
      - crear_folios
      - procesar_vars_sociodemo
      - procesar_vars_hogar
      - procesar_tiempo
      - ipc_enoe
      - imputa_ingocup
      - procesar_vars_laborales
      - calcular_desajuste_estadistico
      - procesar_contribucion_hogar

  - title: "Extensiones del proyecto y cuidados"
    contents:
      - procesar_cuidado_extra
      - procesar_estudio_trabajo
      - procesar_libro1

  - title: "Cuidado de mercado"
    contents:
      - procesar_cuidado_remunerado
      - class_cuidado_rem
      - cmo_to_sinco11_care

  - title: "Funciones auxiliares"
    contents:
      - cmo_to_sinco
      - cmo_to_sinco1d
      - armoniza_sinco
      - starts_with(".")

articles:
  - title: "Uso básico del paquete"
    contents:
      - renoe
      - cuidado-remunerado
      - migracion-0.2.0

authors:
  footer:
    roles: [aut, cre, ctb]
    text: "Desarrollado por Ana Escoto, con contribuciones de código de Gerardo Damián Hernández y Gabriela Cervantes, en el proyecto PAPIIT IN305925"

url: https://aniuxa.github.io/renoe
